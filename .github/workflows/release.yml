name: Release

# Triggered by tag pushes matching v*. Builds signed macOS bundles for
# aarch64 and x86_64, attaches them to a GitHub Release, and publishes
# the per-platform update manifest to the gh-pages branch where Tauri's
# updater plugin reads it from.
#
# Required GitHub secrets:
#   - TAURI_SIGNING_PRIVATE_KEY            (contents of ~/.tauri/cria-update.key)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (empty string is fine for an
#                                           unprotected dev key)
#
# Also builds an UNSIGNED iOS .ipa (build-ios job) and attaches it to the
# same release. It's deliberately unsigned: there's no paid Apple Developer
# account, so no distribution certificate exists to sign with. The .ipa is
# meant to be sideloaded via SideStore/iLoader, which sign it themselves
# locally with a free Apple ID — no Apple secrets or device UDIDs needed in
# this repo. PRs are still iOS-compile-checked by ci-ios.yml.

on:
  push:
    tags:
      - 'v*'
  # Allow re-running the release for an existing tag without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)release, e.g. v0.1.0-alpha'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Gate: the four version sources must all match the tag before we
  # spend 45 min building. A mismatch here means someone hand-edited
  # instead of `pnpm bump` — the exact failure that shipped a perpetual
  # update banner in v0.4.x and v0.12.5 (see AGENTS.md "Current state").
  # ------------------------------------------------------------------
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Check the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit $(git rev-parse --short HEAD) is not on main. Merge dev into main and tag the merge commit."
            exit 1
          fi
      - name: Check all version sources equal the tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          WANT="${TAG#v}"

          scripts/check-versions.sh "$WANT"

  # ------------------------------------------------------------------
  # Build signed bundles per macOS arch.
  # ------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 45
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # Stable self-signed identity so macOS keychain "Always Allow" survives
      # updates (generate with scripts/make-signing-cert.sh). We import it into
      # a temporary keychain ourselves and pass only APPLE_SIGNING_IDENTITY:
      # with APPLE_CERTIFICATE set, Tauri resolves the identity through
      # `security find-identity -v`, which hides untrusted self-signed certs
      # ("failed to resolve signing identity"). Without it, Tauri calls
      # `codesign --sign <hash>` directly, which accepts the cert.
      - name: Configure macOS code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No signing cert configured; using ad-hoc signing."
            exit 0
          fi
          KC="$RUNNER_TEMP/cria-signing.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cria.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cria.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cria.p12"
          security find-identity -p codesigning "$KC"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build signed bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg,updater

      # The bundle layout under src-tauri/target/<target>/release/bundle:
      #   dmg/Cria_<version>_<arch>.dmg            <-- already arch-tagged
      #   macos/Cria.app
      #   macos/Cria.app.tar.gz                    <-- updater archive
      #   macos/Cria.app.tar.gz.sig                <-- updater signature
      #
      # The .app.tar.gz pair has no arch in its name, so when both matrix
      # jobs upload their files into the same flattened release/ dir
      # downstream, the second overwrites the first. Rename per-arch
      # here so each artifact is uniquely identifiable end-to-end.
      - name: Stage release assets
        id: stage
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-${{ matrix.target }}"
          mkdir -p "$out"
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"   # aarch64-apple-darwin -> aarch64
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          cp "$BUNDLE"/dmg/*.dmg "$out/"
          cp "$BUNDLE"/macos/*.app.tar.gz     "$out/Cria_${arch}.app.tar.gz"
          cp "$BUNDLE"/macos/*.app.tar.gz.sig "$out/Cria_${arch}.app.tar.gz.sig"
          ls -la "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cria-${{ matrix.target }}
          path: ${{ steps.stage.outputs.dir }}/*
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Build an unsigned iOS .ipa for sideloading (SideStore/iLoader do their
  # own signing with a free Apple ID, so no Apple secrets are needed here).
  # ------------------------------------------------------------------
  build-ios:
    name: Build unsigned iOS .ipa
    runs-on: macos-latest
    timeout-minutes: 45
    needs: verify-version

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain (iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-ios-ipa-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-ipa-
            ${{ runner.os }}-cargo-ios-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Init iOS project
        run: pnpm tauri ios init

      # `tauri ios init` silently mis-copies some AppIcon.appiconset sizes
      # (they end up as Tauri's default logo instead of ours, even though
      # the source files in src-tauri/icons/ios are correct). Overwrite the
      # generated catalog with our own source images as a workaround.
      - name: Fix iOS app icon (tauri ios init copy bug workaround)
        run: cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/

      - name: Build unsigned archive
        run: pnpm tauri ios build --target aarch64 --no-sign --archive-only --ci

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          ARCHIVE=$(find src-tauri/gen/apple -name '*.xcarchive' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "No .xcarchive found" >&2
            find src-tauri/gen/apple -maxdepth 4 >&2
            exit 1
          fi
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app found in archive" >&2
            exit 1
          fi
          mkdir -p ipa_out/Payload
          cp -R "$APP" ipa_out/Payload/
          (cd ipa_out && zip -qr ../Cria-unsigned.ipa Payload)
          ls -la Cria-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: cria-ios-unsigned
          path: Cria-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------
  # Collect all per-target artifacts, attach them to the GitHub Release,
  # and write update.json to the gh-pages branch.
  # ------------------------------------------------------------------
  publish:
    name: Publish release + update manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, build-ios]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.ipa' \) \
            -exec cp -v {} release/ \;
          ls -la release

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Build the per-platform update manifest the Tauri updater plugin
      # reads from the endpoint in tauri.conf.json. Format spec:
      # https://v2.tauri.app/plugin/updater/#server-support
      - name: Write update.json
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"

          sig_arm=$(cat release/*aarch64*.app.tar.gz.sig)
          sig_x86=$(cat release/*x64*.app.tar.gz.sig 2>/dev/null \
                  || cat release/*x86_64*.app.tar.gz.sig)

          arm_archive=$(basename release/*aarch64*.app.tar.gz)
          x86_archive=$(basename release/$(ls release | grep -E '(x64|x86_64).*app\.tar\.gz$' | head -n1))

          cat > update.json <<EOF
          {
            "version": "${version}",
            "notes": "See https://github.com/${{ github.repository }}/releases/tag/${tag}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${sig_arm}",
                "url": "${base}/${arm_archive}"
              },
              "darwin-x86_64": {
                "signature": "${sig_x86}",
                "url": "${base}/${x86_archive}"
              }
            }
          }
          EOF
          cat update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.app.tar.gz
            release/*.app.tar.gz.sig
            release/*.ipa

      # Push update.json to gh-pages so the configured updater endpoint
      # (https://pocketcoder.github.io/cria/update.json) serves it.
      # `publish_dir` is a staging dir holding only update.json so we don't
      # also push the whole repo into gh-pages.
      - name: Stage gh-pages content
        run: |
          set -euo pipefail
          mkdir -p gh-pages-out
          cp update.json gh-pages-out/

      # Stable app entry in the shared SideStore source (nightly.yml writes the
      # nightly entry into the same file). The .ipa keeps the plain version as
      # both CFBundleShortVersionString and CFBundleVersion, so version and
      # buildVersion match (SideStore rejects a mismatch).
      - name: Write sidestore.json
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          ipa="$(ls release/*.ipa | head -n1)"
          jq -n \
            --arg v "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "Release $tag" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${tag}/$(basename "$ipa")" \
            --arg icon "https://raw.githubusercontent.com/${{ github.repository }}/${tag}/src-tauri/icons/icon.png" \
            --argjson size "$(stat -c %s "$ipa")" '{
              name: "Cria",
              bundleIdentifier: "io.cria.app",
              developerName: "Cria",
              subtitle: "Native Vikunja client",
              localizedDescription: "Native desktop and iOS client for Vikunja.",
              iconURL: $icon,
              versions: [{version: $v, buildVersion: $v, date: $date, size: $size, downloadURL: $url, localizedDescription: $notes}]
            }' > app.json
          # Merge into the shared source: keep the other channel's app entry.
          git fetch --depth 1 origin gh-pages 2>/dev/null && git show origin/gh-pages:sidestore.json > existing.json 2>/dev/null || echo '{}' > existing.json
          jq --slurpfile old existing.json --argjson app "$(cat app.json)" '
            {name: "Cria", identifier: "io.cria.source", news: [],
             apps: ((($old[0].apps // []) | map(select(.bundleIdentifier != $app.bundleIdentifier))) + [$app] | sort_by(.bundleIdentifier))}
          ' > gh-pages-out/sidestore.json
          cat gh-pages-out/sidestore.json

      - name: Publish update.json to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-out
          keep_files: true
          commit_message: 'release: ${{ steps.version.outputs.tag }}'
