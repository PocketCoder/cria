name: Auto-label PRs from title

# Reads the PR title's conventional-commit prefix (feat / fix /
# refactor / chore / docs / test / perf / build / ci / security) and
# applies a matching label so .github/release.yml can bucket it in the
# auto-generated release notes.
#
# Triggered on every PR open / edit so a re-titled PR gets re-labelled.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || '';
            // Match `<type>` or `<type>(scope)` at the start, before `:`.
            const m = title.match(/^([a-z]+)(?:\([^)]+\))?!?:/i);
            if (!m) {
              core.info(`PR title "${title}" has no conventional-commit prefix; skipping.`);
              return;
            }
            const type = m[1].toLowerCase();

            // Map prefix → label name. Keep aligned with
            // .github/release.yml category labels.
            const map = {
              feat:        'feature',
              feature:     'feature',
              fix:         'fix',
              bug:         'fix',
              bugfix:      'fix',
              refactor:    'refactor',
              perf:        'performance',
              performance: 'performance',
              docs:        'documentation',
              doc:         'documentation',
              test:        'test',
              tests:       'test',
              chore:       'chore',
              ci:          'ci',
              build:       'build',
              security:    'security',
              sec:         'security',
            };
            const label = map[type];
            if (!label) {
              core.info(`Unknown prefix "${type}"; not labelling.`);
              return;
            }

            // Ensure the label exists (idempotent — 422 if it does).
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
              core.info(`Created label "${label}".`);
            } catch (e) {
              if (e.status !== 422) throw e;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
            core.info(`Applied label "${label}" to PR #${context.payload.pull_request.number}.`);
