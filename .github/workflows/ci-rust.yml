name: Rust checks

# fmt, clippy and unit tests for the Tauri shell. macOS runner because parts
# of the crate (Vision OCR, the Swift AI bridge) only compile on Apple
# targets. Runs only when the native shell changes. iOS compile-check lives in
# ci-ios.yml.

on:
  push:
    branches: [main, dev]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/ci-rust.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # tauri-build validates that `frontendDist` (../dist) exists.
      - name: Build frontend
        run: pnpm vite:build

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Advisory until the existing warnings are cleaned up; then drop
      # continue-on-error and add `-- -D warnings`.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
