name: Nightly

# Every push to dev builds the native Swift Mac app (ios-native/CriaApp, target CriaMac) as "Cria (Nightly)"
# (io.cria.app.nightly) and attaches a DMG and a zip to the single rolling `nightly` prerelease, which also holds the
# iOS .ipa (ci-swift.yml). The Tauri desktop app no longer builds here; its stable releases still come from
# release.yml until the handover (docs/SWIFT-MACOS-PLAN.md, Phase 8).
#
# Not notarised, and no Sparkle feed yet (that needs the key pair, Phase 7), so installs are manual: open the DMG,
# drag to Applications, then right-click > Open the first time.
#
# Version is <package.json version> with the workflow run number as the build number.

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A newer push supersedes an in-flight nightly.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Mac app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native/CriaApp
        run: xcodegen generate

      # Stable self-signed identity so the keychain "Always Allow" survives updates (scripts/make-signing-cert.sh).
      # Imported into a temporary keychain; with no secrets the build is ad-hoc signed.
      - name: Configure macOS code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No signing cert configured; using ad-hoc signing."
            exit 0
          fi
          KC="$RUNNER_TEMP/cria-signing.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cria.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cria.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cria.p12"
          security find-identity -p codesigning "$KC"
          echo "SIGN_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Archive (universal)
        working-directory: ios-native/CriaApp
        run: |
          set -euo pipefail
          version="$(jq -r .version ../../package.json)"
          xcodebuild archive \
            -project CriaApp.xcodeproj \
            -scheme CriaMac \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Cria.xcarchive" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            PRODUCT_BUNDLE_IDENTIFIER=io.cria.app.nightly \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CRIA_FEED_URL=https://pocketcoder.github.io/cria/nightly-appcast.xml \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGN_IDENTITY:--}" \
            DEVELOPMENT_TEAM=""

      - name: Package DMG and zip
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/Cria.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "No .app in the archive" >&2; exit 1; }
          codesign --verify --deep --strict "$APP" || echo "::warning::codesign verification failed for $APP"
          # PRODUCT_NAME is not overridden at build time (a command-line override reaches every target, including
          # package resource bundles, and two outputs then share a name). The app is renamed here instead.
          mkdir -p out dmg stage
          ditto "$APP" "stage/Cria (Nightly).app"
          ditto -c -k --keepParent "stage/Cria (Nightly).app" out/Cria-Nightly-macOS.zip
          ditto "stage/Cria (Nightly).app" "dmg/Cria (Nightly).app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Cria Nightly" -srcfolder dmg -ov -format UDZO out/Cria-Nightly-macOS.dmg

      # Sparkle verifies every update against the public key in the app, so the zip is signed with the matching private
      # key (the SPARKLE_PRIVATE_KEY secret). The signature line travels in out/ for the publish job's appcast and is not
      # uploaded to the release.
      - name: Sign update (Sparkle)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not set, so no update feed is published"
            exit 0
          fi
          TOOL="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*artifacts/sparkle/Sparkle/bin/sign_update' -print -quit)"
          [ -n "$TOOL" ] || { echo "::error::sign_update not found in the resolved Sparkle package"; exit 1; }
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          "$TOOL" out/Cria-Nightly-macOS.zip --ed-key-file "$RUNNER_TEMP/sparkle.key" | tee out/sparkle-sig.txt
          rm -f "$RUNNER_TEMP/sparkle.key"

      # A build that cannot start must never reach the release (a missing or unloadable framework aborts in dyld before
      # any window opens). Launches the packaged binary for a few seconds and fails on a dyld error.
      - name: Launch check
        run: |
          set -u
          BIN="stage/Cria (Nightly).app/Contents/MacOS/Cria"
          "$BIN" >launch.log 2>&1 &
          pid=$!
          sleep 8
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat launch.log
          if grep -qiE "Library not loaded|dyld\[|Symbol not found" launch.log; then
            echo "::error::The app failed to load at launch"
            exit 1
          fi
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-macos
          path: out/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish nightly release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      # The update feed the app reads (SUFeedURL = nightly-appcast.xml on gh-pages). sparkle:version must be the build
      # number the app was built with (the run number), so it only ever grows.
      - name: Write nightly-appcast.xml
        run: |
          set -euo pipefail
          if [ ! -f release/sparkle-sig.txt ]; then
            echo "::warning::no Sparkle signature, so the update feed is not written"
            exit 0
          fi
          mv release/sparkle-sig.txt sparkle-sig.txt  # the signature is not a release asset
          mkdir -p gh-pages-out
          version="$(jq -r .version package.json)"
          url="https://github.com/${{ github.repository }}/releases/download/nightly/Cria-Nightly-macOS.zip"
          sig="$(tr -d '\n' < sparkle-sig.txt)"
          cat > gh-pages-out/nightly-appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Cria Nightly</title>
              <item>
                <title>Nightly (dev @ ${GITHUB_SHA::7})</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>${version}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <enclosure url="${url}" ${sig} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XML
          cat gh-pages-out/nightly-appcast.xml
      # One rolling release for the nightly Mac build and the iOS .ipa (ci-swift.yml adds that). It is updated in place,
      # not deleted and recreated, so the .ipa survives a Mac-only push. The tag moves to the latest push.
      - name: Update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          title="Nightly (dev @ ${GITHUB_SHA::7})"
          notes="Automated build of \`dev\` at ${GITHUB_SHA}: the native Mac app (**Cria (Nightly)**, DMG or zip; not notarised, so right-click > Open the first time) and the unsigned iOS .ipa for SideStore. Unstable."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "$title" --notes "$notes"
          else
            gh release create nightly --verify-tag --prerelease --title "$title" --notes "$notes" \
              || gh release edit nightly --prerelease --title "$title" --notes "$notes"
          fi
          # Drop the Tauri-era assets so the release only lists the current builds.
          for old in $(gh release view nightly --json assets --jq '.assets[].name' | grep -E '^Cria-Nightly_.*(\.dmg|\.tar\.gz|\.sig)$' || true); do
            gh release delete-asset nightly "$old" --yes
          done
          gh release upload nightly release/* --clobber
      - name: Publish nightly-appcast.xml to gh-pages
        if: hashFiles('gh-pages-out/nightly-appcast.xml') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-out
          keep_files: true
          commit_message: 'nightly appcast: ${{ github.sha }}'
