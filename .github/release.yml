# Categorises GitHub's auto-generated release notes (enabled via
# `generate_release_notes: true` in .github/workflows/release.yml).
#
# Each merged PR is bucketed by its labels. PRs labelled
# `skip-changelog` (or authored by dependabot) are excluded entirely.
# The labels themselves are applied automatically from the PR title
# prefix by .github/workflows/pr-label.yml — feat/fix/refactor/etc.
# That keeps PR ceremony to "name your branch well" only.

changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
    authors:
      - dependabot

  categories:
    - title: ✨ Features
      labels:
        - feature
        - enhancement

    - title: 🐛 Fixes
      labels:
        - bug
        - fix

    - title: ♻️  Refactors
      labels:
        - refactor

    - title: 🚀 Performance
      labels:
        - performance

    - title: 📝 Documentation
      labels:
        - documentation
        - docs

    - title: 🧪 Tests
      labels:
        - test
        - tests

    - title: 🔧 Chores
      labels:
        - chore
        - ci
        - build

    - title: 🔒 Security
      labels:
        - security

    - title: Other changes
      labels:
        - "*"
