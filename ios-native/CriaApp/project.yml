# XcodeGen spec. Run `xcodegen generate` in this folder to create CriaApp.xcodeproj.
# The .xcodeproj is generated, not committed.
name: CriaApp
options:
  bundleIdPrefix: io.cria
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
packages:
  CriaKit:
    path: ../CriaKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  CriaApp:
    type: application
    platform: iOS
    sources: [CriaApp]
    dependencies:
      - package: CriaKit
      - target: CriaShare
      - target: CriaWidgets
    info:
      path: Config/CriaApp-Info.plist
      properties:
        UIAppFonts: [Onest-Bold.ttf]
        # Ramble's on-device model run continues in the background as a BGContinuedProcessingTask on iOS 26
        # (BackgroundRun.swift). Its identifiers are "<bundle id>.ai.<uuid>". No background mode is needed.
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).ai.*"]
        CFBundleURLTypes:
          - CFBundleURLName: io.cria.app.swift
            CFBundleURLSchemes: [cria]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cria.app.swift
        PRODUCT_NAME: Cria
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos to attach to your tasks.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Listen while you speak a list of tasks.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn what you say into text for your tasks.
        CODE_SIGN_ENTITLEMENTS: CriaApp/CriaApp.entitlements
  CriaShare:
    type: app-extension
    platform: iOS
    sources: [CriaShare]
    dependencies:
      - package: CriaKit
    info:
      path: Config/CriaShare-Info.plist
      properties:
        CFBundleDisplayName: Cria
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cria.app.swift.share
        PRODUCT_NAME: CriaShare
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CriaShare/CriaShare.entitlements
  CriaWidgets:
    type: app-extension
    platform: iOS
    sources: [CriaWidgets]
    dependencies:
      - package: CriaKit
    info:
      path: Config/CriaWidgets-Info.plist
      properties:
        CFBundleDisplayName: Cria
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cria.app.swift.widgets
        PRODUCT_NAME: CriaWidgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CriaWidgets/CriaWidgets.entitlements
  CriaMac:
    type: application
    platform: macOS
    sources:
      - CriaMac
      - path: CriaApp
        excludes:
          # Replaced by the Mac shell (Phase 2) and the iOS entry points.
          - CriaApp.swift
          - Shell/ShellView.swift
          - Platform/CriaIntents.swift
          # Phase 6.
          - Tasks/CameraPicker.swift
          - AI/BackgroundRun.swift
          # The Mac target has its own asset catalogue (LoginIcon copied across).
          - Assets.xcassets
    dependencies:
      - package: CriaKit
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: Config/CriaMac-Info.plist
      properties:
        # Sparkle. The feed and key come from build settings below so CI can switch the nightly feed on the command
        # line. A build with no key (CRIA_SPARKLE_PUBLIC_KEY empty) does not start the updater (MacUpdater).
        SUFeedURL: $(CRIA_FEED_URL)
        SUPublicEDKey: $(CRIA_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        CFBundleURLTypes:
          - CFBundleURLName: io.cria.app
            CFBundleURLSchemes: [cria]
        # Onest (Fonts/, copied to Resources) for the wordmark, as on iOS.
        ATSApplicationFontsPath: "."
    settings:
      base:
        PRODUCT_NAME: Cria
        # Llama purple for system controls when the Mac's accent is set to Multicolour.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Listen while you speak a list of tasks.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn what you say into text for your tasks.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: CriaMac/CriaMac.entitlements
        CRIA_FEED_URL: https://pocketcoder.github.io/cria/appcast.xml
        # The EdDSA public key of the update signing pair; the private half is the SPARKLE_PRIVATE_KEY Actions secret.
        CRIA_SPARKLE_PUBLIC_KEY: "W8oC2QATE2W96VY+cvU7g/v+Oftz/iayzhRSmop7V1o="
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.cria.app.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.cria.app
