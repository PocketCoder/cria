# XcodeGen spec. Run `xcodegen generate` in this folder to create CriaApp.xcodeproj.
# The .xcodeproj is generated, not committed.
name: CriaApp
options:
  bundleIdPrefix: io.cria
  deploymentTarget:
    iOS: "17.0"
packages:
  CriaKit:
    path: ../CriaKit
targets:
  CriaApp:
    type: application
    platform: iOS
    sources: [CriaApp]
    dependencies:
      - package: CriaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cria.app.swift
        PRODUCT_NAME: Cria
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: CriaApp/CriaApp.entitlements
