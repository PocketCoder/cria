# SwiftLint config for ios-native. Keep rules minimal; add only when a real defect class appears.
included:
  - CriaKit/Sources
  - CriaKit/Tests
  - CriaApp/CriaApp
  - CriaApp/CriaMac
excluded:
  - CriaApp/CriaApp.xcodeproj
  - CriaKit/.build
  - CriaKit/.swiftpm
disabled_rules:
  - trailing_whitespace
line_length:
  warning: 140
  error: 200
identifier_name:
  min_length:
    warning: 3
  excluded: [op, id, t, r]
large_tuple:
  warning: 4
  error: 6
cyclomatic_complexity:
  warning: 20
  error: 30
function_parameter_count:
  warning: 8
  error: 10
