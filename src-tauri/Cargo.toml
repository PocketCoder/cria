[package]
name = "cria"
version = "0.10.0"
description = "A native desktop client for Vikunja"
authors = ["jake"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` feature is desktop-only inside Tauri (the tray-icon crate is
# target-gated to desktop), so leaving it enabled is a no-op on iOS/Android.
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# Platform detection (used by the frontend via @tauri-apps/plugin-os).
tauri-plugin-os = "2"
# Mobile haptic feedback (iOS/Android only; no-op on desktop inside the plugin).
tauri-plugin-haptics = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["sync"] }

# Desktop-only plugins. iOS/Android have no system tray, global shortcuts,
# launch-at-login, sidecar process control, or self-updating, so these crates
# are excluded from mobile builds entirely (their usage in lib.rs is gated with
# `#[cfg(desktop)]`).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
