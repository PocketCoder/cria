[package]
name = "cria"
version = "0.10.0"
description = "A native desktop client for Vikunja"
authors = ["jake"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` feature is desktop-only inside Tauri (the tray-icon crate is
# target-gated to desktop), so leaving it enabled is a no-op on iOS/Android.
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# Platform detection (used by the frontend via @tauri-apps/plugin-os).
tauri-plugin-os = "2"
# Mobile haptic feedback (iOS/Android only; no-op on desktop inside the plugin).
tauri-plugin-haptics = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["sync"] }

# Desktop-only plugins. iOS/Android have no system tray, global shortcuts,
# launch-at-login, sidecar process control, or self-updating, so these crates
# are excluded from mobile builds entirely (their usage in lib.rs is gated with
# `#[cfg(desktop)]`).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# OS keychain for the auth token (see src/secure.rs). One backend per OS family
# so each build pulls only the deps it needs — Windows/Linux below; the Apple
# `apple-native` backend (Keychain via SecItem, macOS + iOS) lives in the shared
# apple dependency table further down.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

# Apple-platform native deps (macOS + iOS): Vision OCR for the shopping-list
# photo feature, and the keyring Keychain backend for the auth token.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
base64 = "0.22"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSError",
] }
objc2-vision = { version = "0.3", features = [
    "VNRequest",
    "VNRequestHandler",
    "VNRecognizeTextRequest",
    "VNObservation",
    "VNTypes",
    "alloc",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
